<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a231c" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="50%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>

    <!-- Glowing Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; letter-spacing: -1px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #7ee787; letter-spacing: 0.5px; }
      .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 15px; fill: #8b949e; }
      
      /* Dynamic / Animated Elements */
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.7; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      
      @keyframes dashFlow {
        from { stroke-dashoffset: 100; }
        to { stroke-dashoffset: 0; }
      }

      @keyframes floatPill {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
        100% { transform: translateY(0px); }
      }

      .animated-bg-circle { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .flow-line { stroke-dasharray: 8 8; animation: dashFlow 4s linear infinite; }
      .floating-card { animation: floatPill 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Dark Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2" />

  <!-- Background Dynamic Graphic Elements (Behind Text) -->
  <g class="animated-bg-circle" opacity="0.4">
    <circle cx="1050" cy="80" r="180" fill="#2ea043" opacity="0.15" filter="url(#glow)" />
    <circle cx="150" cy="280" r="140" fill="#1f6feb" opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- Supply Chain Dynamic Flow Lines (Background Dynamic Aspect) -->
  <g stroke="#3fb950" stroke-width="2" opacity="0.3" class="flow-line">
    <path d="M 50,280 C 300,280 400,60 700,60 C 950,60 1050,280 1150,280" fill="none" />
    <path d="M 100,300 C 350,300 450,40 750,40 C 1000,40 1100,300 1180,300" fill="none" stroke="#58a6ff" />
  </g>

  <!-- Subtle Dynamic Tech Grid Nodes -->
  <g fill="#3fb950" opacity="0.5">
    <circle cx="200" cy="235" r="4" />
    <circle cx="500" cy="115" r="4" />
    <circle cx="850" cy="60" r="4" />
    <circle cx="1050" cy="235" r="4" />
  </g>

  <!-- Foreground Content Block (Clear & Visible) -->
  <g transform="translate(60, 0)">
    <!-- Top Decorative Line -->
    <rect x="0" y="55" width="80" height="5" rx="2.5" fill="url(#accentGrad)" />

    <!-- Title & Subtitles in Foreground -->
    <text x="0" y="115" class="title">Awesome Food Traceability 🌾🔍</text>
    <text x="0" y="155" class="subtitle">Farm-to-Fork Visibility • FSMA 204 • Lot Genealogy • GS1 EPCIS &amp; Ledger Tech</text>
    <text x="0" y="190" class="tagline">Curated Directory of Top SaaS Platforms, Open-Source Schemas &amp; Supply-Chain Standards</text>

    <!-- Foreground Stat / Tag Badges -->
    <g transform="translate(0, 225)">
      <!-- Badge 1 -->
      <g class="floating-card">
        <rect x="0" y="0" width="160" height="38" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
        <text x="15" y="24" font-family="sans-serif" font-size="13" font-weight="600" fill="#7ee787">📦 Lot Genealogy</text>
      </g>
      
      <!-- Badge 2 -->
      <g transform="translate(175, 0)" class="floating-card" style="animation-delay: 1s;">
        <rect x="0" y="0" width="160" height="38" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
        <text x="15" y="24" font-family="sans-serif" font-size="13" font-weight="600" fill="#58a6ff">🛡️ FSMA 204 Ready</text>
      </g>

      <!-- Badge 3 -->
      <g transform="translate(350, 0)" class="floating-card" style="animation-delay: 2s;">
        <rect x="0" y="0" width="175" height="38" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
        <text x="15" y="24" font-family="sans-serif" font-size="13" font-weight="600" fill="#d2a8ff">⚡ GS1 EPCIS 2.0</text>
      </g>

      <!-- Badge 4 -->
      <g transform="translate(540, 0)" class="floating-card" style="animation-delay: 3s;">
        <rect x="0" y="0" width="170" height="38" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
        <text x="15" y="24" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffa657">🔗 Open Blockchain</text>
      </g>
    </g>
  </g>
</svg>
